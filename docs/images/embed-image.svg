<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs>
<rect width="900" height="400" fill="#ffffff"/>
<rect x="20" y="20" width="400" height="200" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="40" y="50" font-size="15" font-weight="600" fill="#1f2328">1. Your files in the repository</text>
<g font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2328">
<text x="40" y="84">midterm/</text>
<text x="40" y="110">├── <tspan font-weight="700" fill="#cf222e">EXERCISES.md</tspan></text>
<text x="40" y="136">└── figures/</text>
<text x="72" y="162">└── track-a/</text>
<text x="104" y="188">└── <tspan font-weight="700" fill="#0969da">ex1_result.png</tspan></text>
</g>
<text x="400" y="110" text-anchor="end" font-size="12" fill="#cf222e">← you write here</text>
<text x="400" y="188" text-anchor="end" font-size="12" fill="#0969da">← your screenshot</text>
<rect x="480" y="20" width="400" height="200" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="500" y="50" font-size="15" font-weight="600" fill="#1f2328">3. What readers see on GitHub</text>
<text x="500" y="82" font-size="16" font-weight="600" fill="#1f2328">Exercise A1</text>
<rect x="500" y="96" width="240" height="108" rx="4" fill="#ddf4ff" stroke="#0969da"/>
<path d="M512,192 L560,136 L596,176 L620,152 L728,192 Z" fill="#54aeff"/>
<circle cx="700" cy="122" r="12" fill="#ffd33d"/>
<rect x="20" y="250" width="860" height="135" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="40" y="280" font-size="15" font-weight="600" fill="#1f2328">2. What you type in midterm/EXERCISES.md</text>
<g font-family="Consolas, Menlo, monospace" font-size="16">
<text x="50" y="322" textLength="18" lengthAdjust="spacingAndGlyphs" fill="#1f2328">![</text>
<text x="68" y="322" textLength="153" lengthAdjust="spacingAndGlyphs" fill="#8250df">Exercise 1 result</text>
<text x="221" y="322" textLength="18" lengthAdjust="spacingAndGlyphs" fill="#1f2328">](</text>
<text x="239" y="322" textLength="270" lengthAdjust="spacingAndGlyphs" fill="#0969da">figures/track-a/ex1_result.png</text>
<text x="509" y="322" textLength="9" lengthAdjust="spacingAndGlyphs" fill="#1f2328">)</text>
</g>
<path d="M68,332 L68,338 L221,338 L221,332" fill="none" stroke="#8250df" stroke-width="1.5"/>
<text x="144" y="360" text-anchor="middle" font-size="12" fill="#8250df">short description</text>
<text x="144" y="375" text-anchor="middle" font-size="12" fill="#8250df">(alt text)</text>
<path d="M239,332 L239,338 L509,338 L509,332" fill="none" stroke="#0969da" stroke-width="1.5"/>
<text x="374" y="360" text-anchor="middle" font-size="12" fill="#0969da">path to the file, starting from the folder</text>
<text x="374" y="375" text-anchor="middle" font-size="12" fill="#0969da">that EXERCISES.md is in (midterm/)</text>
<text x="650" y="320" font-size="13" fill="#57606a">The leading <tspan font-weight="700">!</tspan> means</text>
<text x="650" y="338" font-size="13" fill="#57606a">"show the picture". Without it</text>
<text x="650" y="356" font-size="13" fill="#57606a">you get a clickable link instead.</text>
</svg>
